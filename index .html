function quiz(){const q=Q.qs[Q.i],c=CM[q.c];return`<div class=qt><button class=ib onclick="quit()" aria-label="Quitter">✕</button><b>Question ${Q.i+1} / ${Q.qs.length}</b><span class=hp id=hp>❤️ ${Q.lives}</span></div><div class="bar g"><i data-w="${(Q.i+1)/Q.qs.length*100}%"></i></div>
<div class=chip>${c.i} ${c.n}</div><h2 class=qq>${q.q}</h2><div id=ans>${q.o.map((o,k)=>`<button class=an id=a${k} onclick="ans(${k})"><b>${'ABCD'[k]}</b><span>${o.t}</span></button>`).join('')}</div><div id=fb></div><div class=ft id=ft><button class="bt gh" onclick="skip()">⏭ Passer</button><button class="bt gh" onclick="hint()">💡 Indice (10 🪙)</button></div>`}
function quit(){modal(`<h3>Quitter le quiz ?</h3><p>Ta progression de cette partie sera perdue (l'XP déjà gagné est conservé).</p><button class="bt gn" onclick="closeM()">Continuer</button><button class="bt gh" onclick="closeM();Q=null;go('home')">Quitter</button>`)}
function ans(k){if(Q.st)return;Q.st=1;const q=Q.qs[Q.i],o=q.o[k],ok=o.r,r=q.o.find(x=>x.r),g=ok?100:20;Q.xp+=g;S.xp+=g;
if(ok){Q.ok++;S.cor++;const a=S.cp[q.c]=S.cp[q.c]||[];a.includes(q.id)||a.push(q.id);S.coins+=5;conf();vib(30)}else{Q.bad++;Q.lives--;vib([60,40,60])}
tn(ok);fx('+'+g+' XP');Q.ans.push({q:q.q,ch:o.t,ok,r:r.t,e:q.e});
$('a'+k).classList.add(ok?'ok':'ko');if(!ok)$('a'+q.o.indexOf(r)).classList.add('ok');$('ans').classList.add('lk');$('hp').textContent='❤️ '+Q.lives;$('ft').style.display='none';
const last=Q.i>=Q.qs.length-1||Q.lives<=0;
$('fb').innerHTML=`<div class="fb ${ok?'g':'r'}"><div class=fh>${ok?'✅ Bonne réponse !':'❌ Mauvaise réponse !'}<span class=xpb>+${g} XP</span></div>${ok?'':`<p>La bonne réponse est : <b>${r.t}</b></p>`}<p class=ex>💡 ${q.e}</p>${Q.lives<=0?'<p>💔 Tu n\'as plus de vies.</p>':''}</div><button class="bt ${ok?'gn':''}" onclick="nxt()">${last?'Voir le résultat':'Question suivante'} →</button>`;
$('fb').scrollIntoView({behavior:'smooth',block:'end'});save()}
function nxt(){if(Q.i>=Q.qs.length-1||Q.lives<=0)finish();else{Q.i++;Q.st=0;Q.hint=0;render()}}
function skip(){if(Q.st)return;const q=Q.qs[Q.i];Q.ans.push({q:q.q,ch:'(passée)',ok:0,r:q.o.find(x=>x.r).t,e:q.e});nxt()}
function hint(){if(Q.st)return;if(Q.hint)return toast('Un seul indice par question');const q=Q.qs[Q.i];
if(S.coins>=10)S.coins-=10;else if(Q.lives>1){Q.lives--;$('hp').textContent='❤️ '+Q.lives;toast('−1 ❤️ utilisé pour l\'indice')}
else return modal(`<h3>Pas assez de pièces</h3><p>Regarde une publicité pour gagner 20 🪙.</p><button class="bt gn" onclick="closeM();showRewardedAd(()=>{S.coins+=20;save();toast('+20 🪙')})">🎬 Regarder une pub</button><button class="bt gh" onclick="closeM()">Fermer</button>`);
Q.hint=1;sh([0,1,2,3].filter(k=>!q.o[k].r)).slice(0,2).forEach(k=>$('a'+k).classList.add('off'));save()}
function finish(){const t=today(),y=ymd(Date.now()-864e5);Q.xp+=50;S.xp+=50;let bonus=0;
if(Q.daily&&S.dd!==t){S.dd=t;bonus=100;Q.xp+=100;S.xp+=100}
if(S.last!==t){S.streak=S.last===y?S.streak+1:1;S.last=t}
[[3,30],[7,100],[14,200],[30,500]].forEach(([d,c])=>{if(S.streak>=d&&!S.sr.includes(d)){S.sr.push(d);S.coins+=c}});
S.played++;if(Q.ok==Q.qs.length)S.perf++;const rec=Q.xp>S.best;if(rec)S.best=Q.xp;
S.hist.unshift({t:Date.now(),c:CM[Q.cat].n,ok:Q.ok,n:Q.qs.length,xp:Q.xp});S.hist=S.hist.slice(0,50);
R={ok:Q.ok,n:Q.qs.length,bad:Q.bad,xp:Q.xp,rec,nb:chk(),over:Q.lives<=0,ans:Q.ans,bonus};Q.fin=1;save();conf(60);go('result')}
function result(){const p=R.ok/R.n,m=p==1?'Parfait !':p>=.7?'Bon travail !':p>=.4?'Pas mal, continue !':'Courage, retente !';
return`<div class=res>${R.rec?'<div class=rec>🎉 NOUVEAU RECORD !</div>':''}<div class=trophy>🏆</div><h2>Résultat du quiz</h2><div class=ring><svg viewBox="0 0 120 120"><circle cx=60 cy=60 r=52 class=rb></circle><circle cx=60 cy=60 r=52 class=rf data-d="${p*327} 327"></circle></svg><b>${R.ok}/${R.n}</b></div><h3>${m}</h3>${R.over?'<small>💔 Fin de partie : plus de vies</small>':''}
<div class=g3><div class=cd>⭐<b>+${R.xp}</b><small>XP gagnés</small></div><div class=cd>🔥<b>${sk()} j</b><small>Série</small></div><div class=cd>🏆<b>${S.best}</b><small>Meilleur score</small></div></div>
<div class=cd style="text-align:left">✅ Bonnes réponses <b style="float:right">${R.ok}</b><br>❌ Mauvaises réponses <b style="float:right">${R.bad}</b>${R.bonus?'<br>📅 Défi du jour <b style="float:right">+100 XP</b>':''}</div>
${R.nb.length?`<div class=cd>🎖️ Nouveau badge : ${R.nb.map(b=>b.i+' '+b.n).join(', ')}</div>`:''}
<button class="bt y" onclick="startQuiz()">REJOUER</button><button class="bt gh" onclick="reviewM()">VOIR LES RÉPONSES</button><button class="bt gh" onclick="showRewardedAd(()=>{S.coins+=20;save();toast('+20 🪙 ajoutées')})">🎬 +20 🪙 en regardant une pub</button><button class="bt gh" onclick="go('home')">RETOUR À L'ACCUEIL</button><div class=ad>AD SPACE · Après quiz</div></div>`}
function reviewM(){modal(`<h3>Tes réponses</h3>`+R.ans.map(a=>`<div class=rv><b>${a.ok?'✅':'❌'} ${a.q}</b>Ta réponse : ${a.ch}<br>Bonne réponse : ${a.r}<br><small>💡 ${a.e}</small></div>`).join('')+`<button class="bt" onclick="closeM()">Fermer</button>`)}
/* ---- classement ---- */
function lb(){const k=lbt,sc={d:.1,w:.45,m:1},me=S.hist.filter(h=>k=='d'?ymd(h.t)==today():Date.now()-h.t<(k=='w'?7:30)*864e5).reduce((a,h)=>a+h.xp,0);
const L=FK.map(f=>({n:f[0],a:f[2],s:Math.round(f[1]*sc[k])})).concat({n:S.name,a:S.av,s:me,me:1}).sort((a,b)=>b.s-a.s),f=n=>n.toLocaleString('fr-FR');
const pd=i=>{const u=L[i];return`<div class="p${i+1} ${u.me?'me':''}"><div class=av>${u.a}</div><b>${esc(u.n)}</b><small>${i==0?'🥇':i==1?'🥈':'🥉'} ${f(u.s)}</small></div>`};
return`<h3 class=ttl>Classement</h3><div class=tabs>${[['d','Quotidien'],['w','Hebdomadaire'],['m','Mensuel']].map(([a,b])=>`<button class="ch ${k==a?'on':''}" onclick="lbt='${a}';render()">${b}</button>`).join('')}</div>
<div class=pod>${pd(1)}${pd(0)}${pd(2)}</div>${L.slice(3).map((u,i)=>`<div class="row ${u.me?'me':''}"><span class=n>${i+4}</span><div class=av>${u.a}</div><span>${esc(u.n)}${u.me?' (toi)':''}</span><small style="color:inherit">Niv. ${lv(u.s*3).l}</small><b>${f(u.s)}</b></div>`).join('')}<small style="text-align:center;margin-top:8px">Classement de démonstration (local)</small>`}
/* ---- profil ---- */
function profile(){return`<div class=pr><div class="av big">${S.av}</div><div class=fl><h2>${esc(S.name)}<button class=ib aria-label="Modifier" onclick="editP()">✏️</button></h2><span class=lvb>Niveau ${lv(S.xp).l}</span>${xpb()}</div></div>
<div class=g4><div class=cd><b>${S.played}</b><small>Quiz joués</small></div><div class=cd><b>${S.best}</b><small>Meilleur score</small></div><div class=cd><b>${sk()}</b><small>Série actuelle</small></div><div class=cd><b>${S.xp}</b><small>XP total</small></div></div>
<div class=sh style="margin-top:14px"><b>Badges</b><small>${S.bd.length}/${B.length} • 🪙 ${S.coins}</small></div><div class=bgs>${B.map(b=>`<div class="bg ${S.bd.includes(b.id)?'':'lc'}"><i>${S.bd.includes(b.id)?b.i:'🔒'}</i>${b.n}</div>`).join('')}</div>
<div class=sh><b>Récompenses de série</b></div><div class=sr>${[[3,30],[7,100],[14,200],[30,500]].map(([d,c])=>`<div class="${S.sr.includes(d)?'dn':''}">🔥 ${d} j<br>+${c} 🪙</div>`).join('')}</div>
<button class=ml onclick="histM()">📜<span>Historique des quiz</span>›</button><button class=ml onclick="go('settings')">⚙️<span>Paramètres</span>›</button><button class=ml onclick="helpM()">❓<span>Aide</span>›</button><button class=ml onclick="aboutM()">ℹ️<span>À propos</span>›</button><button class=ml onclick="go('premium')">👑<span>NEXORA Premium</span>›</button>`}
function histM(){modal(`<h3>Historique des quiz</h3>`+(S.hist.length?S.hist.slice(0,25).map(h=>`<div class=rv><b>${h.c} — ${h.ok}/${h.n}</b><small>${new Date(h.t).toLocaleDateString('fr-FR')} • +${h.xp} XP</small></div>`).join(''):'<p>Aucun quiz joué pour le moment. Lance ta première partie !</p>')+`<button class="bt" onclick="closeM()">Fermer</button>`)}
function editP(){tmpAv=S.av;modal(`<h3>Modifier le profil</h3><input id=nm maxlength=14 value="${esc(S.name)}" aria-label="Pseudo"><div class=avs>${AVS.map(a=>`<button class="${a==tmpAv?'on':''}" onclick="tmpAv='${a}';document.querySelectorAll('.avs button').forEach(b=>b.classList.toggle('on',b.textContent=='${a}'))">${a}</button>`).join('')}</div><button class="bt gn" onclick="saveP()">Enregistrer</button>`)}
function saveP(){S.name=($('nm').value.trim()||'Joueur').slice(0,14);S.av=tmpAv;save();closeM();render();toast('Profil enregistré')}
function helpM(){modal(`<h3>Aide</h3><p>• Choisis une catégorie, une difficulté et un nombre de questions.</p><p>• Bonne réponse : +100 XP. Mauvaise : +20 XP et −1 ❤️. Quiz terminé : +50 XP.</p><p>• Indice : retire 2 mauvaises réponses (10 🪙 ou 1 ❤️).</p><p>• Joue chaque jour pour prolonger ta série 🔥 et gagner des pièces.</p><button class="bt" onclick="closeM()">Fermer</button>`)}
function aboutM(){modal(`<h3>À propos</h3><p>NEXORA QUIZ · version 1.0.0<br>Plus qu'un jeu, c'est une aventure de connaissances !</p><p>Toutes tes données sont enregistrées uniquement sur cet appareil.</p><button class="bt" onclick="closeM()">Fermer</button>`)}
/* ---- premium ---- */
function premium(){return hd('Premium')+`<div class=prm><div style="font-size:54px">👑</div><div class=nx style="font-size:30px">NEXORA</div><div class=qz style="font-size:22px">QUIZ</div><h3 style="margin:8px 0 14px">Version Premium</h3></div>
<div class=cd><ul class=vl><li>Sans publicité</li><li>Toutes les catégories</li><li>Vies illimitées</li><li>Bonus XP</li><li>Badges exclusifs</li><li>Défis Premium</li></ul></div>
<div class=pl><div onclick="startPurchase('7 jours')" role=button style="border-color:var(--ye)">7 jours<small>Gratuit</small></div><div onclick="startPurchase('1 mois')" role=button style="border-color:var(--vi)">1 mois<small>2 500 FCFA</small></div></div>
<button class="bt y" onclick="startPurchase('Premium')">👑 Devenir Premium</button><small style="text-align:center">Tu peux aussi regarder une pub pour gagner des pièces.</small><button class="bt gh" onclick="showRewardedAd(()=>{S.coins+=20;save();toast('+20 🪙 ajoutées')})">🎬 Regarder une pub (+20 🪙)</button>`}
/* ---- paramètres ---- */
const tg=(k,el)=>{S.set[k]=S.set[k]?0:1;el.classList.toggle('on');if(k=='not'&&S.set.not&&'Notification'in window)Notification.requestPermission();apply();save()};
function apply(){document.body.classList.toggle('lt',!S.set.dark);music()}
const trow=(i,t,k)=>`<div class=ml>${i}<span>${t}</span><div class="sw ${S.set[k]?'on':''}" role=switch aria-label="${t}" onclick="tg('${k}',this)"></div></div>`;
function settings(){return hd('Paramètres')+`<h4>Compte</h4><button class=ml onclick="editP()">✏️<span>Modifier le pseudo et l'avatar</span>›</button>${trow('🔔','Notifications','not')}<h4>Son et affichage</h4>${trow('🔊','Son','snd')}${trow('🎵','Musique','mus')}${trow('🌙','Mode sombre','dark')}<div class=ml>🌐<span>Langue</span><em>🇫🇷 Français</em></div>
<h4>Aide</h4><button class=ml onclick="helpM()">❓<span>Centre d'aide</span>›</button><button class=ml onclick="modal('<h3>Nous contacter</h3><p>Écris-nous à <b>${CONTACT_EMAIL}</b></p><a class=bt href=mailto:${CONTACT_EMAIL} style=text-align:center;text-decoration:none;line-height:54px>Envoyer un e-mail</a><button class=&quot;bt gh&quot; onclick=closeM()>Fermer</button>')">✉️<span>Nous contacter</span>›</button><button class=ml onclick="aboutM()">ℹ️<span>À propos</span><em>v1.0.0</em></button>
<button class="bt gh" style="border-color:var(--rd);color:var(--rd);margin-top:18px" onclick="resetM()">Réinitialiser les données</button>`}
function resetM(){modal(`<h3>Réinitialiser les données ?</h3><p>Ton pseudo, ton XP, tes badges et ta progression seront supprimés. Cette action est définitive.</p><button class="bt" style="background:var(--rd)" onclick="doReset()">Oui, tout supprimer</button><button class="bt gh" onclick="closeM()">Annuler</button>`)}
function doReset(){try{localStorage.removeItem('nexora_quiz')}catch(e){}S=DEF();Q=null;R=null;closeM();apply();go('home');toast('Données réinitialisées')}
/* ---- démarrage ---- */
document.addEventListener('click',()=>{if(S.set.mus&&!mi)music()},{once:true});
apply();history.replaceState({p:'home'},'');render();
</script>
</body>
</html>
